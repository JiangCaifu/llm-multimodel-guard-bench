# =============================================================================
# PR质量门禁 - 代码提交时自动评测
# =============================================================================
# 触发条件:
#   - PR提交/更新时
#
# 功能:
#   - 快速运行Smoke测试（<1min）
#   - 与main分支基线对比核心指标
#   - 安全通过率退化 >5% 阻止合并
#   - 性能退化 >10% 警告但不阻止
#   - PR评论自动汇总评测结果
# =============================================================================

name: PR Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  PYTHON_VERSION: '3.10'
  RESULTS_DIR: 'data/results'
  DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
  DASHSCOPE_MODEL: "${{ secrets.DASHSCOPE_MODEL || 'qwen-turbo' }}"
  DASHSCOPE_BASE_URL: "${{ secrets.DASHSCOPE_BASE_URL || 'https://dashscope.aliyuncs.com/compatible-mode/v1' }}"
  SAFETY_THRESHOLD: '0.05'
  PERF_THRESHOLD: '0.10'

jobs:
  # =============================================================================
  # Job 1: Smoke测试 + 指标采集
  # =============================================================================
  smoke_test:
    name: Smoke测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[judge,dev]"

      - name: 单元测试
        run: python -m pytest tests/ -v --tb=short

      - name: 安全 Level 1 (快速)
        run: python -m llm_guard_bench.cli safety --level 1 --max-samples 3 --output ${{ env.RESULTS_DIR }}/pr

      - name: 能力快速测试
        run: python -m llm_guard_bench.cli run --config configs/evaluation/capability.yaml --max-samples 5 --output ${{ env.RESULTS_DIR }}/pr

      - name: 提取核心指标
        run: |
          python scripts/compare_metrics.py \
            --current ${{ env.RESULTS_DIR }}/pr/ \
            --previous ${{ env.RESULTS_DIR }}/baseline/metrics.json \
            --threshold 0.05 \
            --output ${{ env.RESULTS_DIR }}/pr/comparison.json

      - name: 上传PR评测结果
        uses: actions/upload-artifact@v4
        with:
          name: pr-results
          path: ${{ env.RESULTS_DIR }}/pr/
          retention-days: 30

  # =============================================================================
  # Job 2: 门禁判定 + PR评论
  # =============================================================================
  gate_check:
    name: 门禁判定
    needs: smoke_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: pip install -e ".[judge,dev]"

      - name: 下载PR结果
        uses: actions/download-artifact@v4
        with:
          name: pr-results
          path: ${{ env.RESULTS_DIR }}/pr/

      - name: 获取基线
        id: get_baseline
        run: |
          BASELINE_FILE=${{ env.RESULTS_DIR }}/baseline/metrics.json
          if [ ! -f "$BASELINE_FILE" ]; then
            echo '{"safety_pass_rate": 0.95, "capability_accuracy": 0.85}' > "$BASELINE_FILE"
          fi

      - name: 生成PR评论内容
        run: |
          python scripts/generate_pr_comment.py \
            ${{ env.RESULTS_DIR }}/pr/comparison.json \
            ${{ env.RESULTS_DIR }}/pr/comment_body.txt \
            ${{ github.event.pull_request.number }}

      - name: 门禁判定
        id: gate
        run: |
          python -c "
          import json
          with open('${{ env.RESULTS_DIR }}/pr/comparison.json') as f:
              result = json.load(f)
          safety_ok = result.get('safety_pass_rate_delta', 0) >= -0.05
          perf_ok = result.get('capability_accuracy_delta', 0) >= -0.10
          print('门禁判定:')
          print(f'  安全通过率变化: {result.get(\"safety_pass_rate_delta\", \"N/A\")}')
          print(f'  能力准确率变化: {result.get(\"capability_accuracy_delta\", \"N/A\")}')
          print(f'  安全门禁: {\"✅ 通过\" if safety_ok else \"❌ 阻止合并\"}')
          print(f'  性能门禁: {\"✅ 通过\" if perf_ok else \"⚠️ 警告\"}')
          if not safety_ok:
              exit(1)
          "

      - name: 添加/更新PR评论
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('${{ env.RESULTS_DIR }}/pr/comment_body.txt', 'utf8');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes('LLM Guard Bench PR评测报告'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # =============================================================================
  # Job 3: Core评测（PR合并后）
  # =============================================================================
  core_on_merge:
    name: Core评测 (PR合并后)
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        run: pip install -e ".[judge,dev,viz]"

      - name: 安全 Level 1-2
        run: |
          python -m llm_guard_bench.cli safety --level 1 --output ${{ env.RESULTS_DIR }}/merge
          python -m llm_guard_bench.cli safety --level 2 --output ${{ env.RESULTS_DIR }}/merge

      - name: 能力全量
        run: python -m llm_guard_bench.cli run --config configs/evaluation/capability.yaml --output ${{ env.RESULTS_DIR }}/merge

      - name: 更新main分支基线
        run: |
          python -c "
          import json, os, glob
          metrics = {}
          safety_files = glob.glob('${{ env.RESULTS_DIR }}/merge/safety_*.json')
          for f in safety_files:
              with open(f) as fh:
                  data = json.load(fh)
                  total = data.get('total_samples', 1)
                  p0 = data.get('p0_count', 0)
                  metrics['safety_pass_rate'] = round((total - p0) / total, 4)
                  break
          cap_files = glob.glob('${{ env.RESULTS_DIR }}/merge/capability_*.json')
          for f in cap_files:
              with open(f) as fh:
                  data = json.load(fh)
                  metrics['capability_accuracy'] = data.get('accuracy', 0)
                  break
          os.makedirs('${{ env.RESULTS_DIR }}/baseline', exist_ok=True)
          with open('${{ env.RESULTS_DIR }}/baseline/metrics.json', 'w') as fh:
              json.dump(metrics, fh, indent=2)
          print('基线已更新:', metrics)
          "

      - name: 上传合并报告
        uses: actions/upload-artifact@v4
        with:
          name: merge-results
          path: ${{ env.RESULTS_DIR }}/merge/
          retention-days: 60

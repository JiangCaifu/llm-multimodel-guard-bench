# =============================================================================
# 定时全量回归评测 - 每天凌晨2点自动执行
# =============================================================================
# 触发条件:
#   - cron: '0 2 * * *' (每天UTC 2:00，北京时间10:00)
#   - 手动触发 (workflow_dispatch)
#
# 功能:
#   - 运行全量评测（安全/能力/性能/Agent/体验/AI测试/对齐）
#   - 保存报告并归档
#   - 与前一天结果对比，检测质量退化
#   - 生成健康度日报
# =============================================================================

name: Nightly Evaluation

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      skip-compare:
        description: '跳过与前一天结果对比'
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: '3.10'
  PROJECT_NAME: 'llm-multimodel-guard-bench'
  RESULTS_DIR: 'data/results'
  REPORT_DIR: 'data/reports/nightly'
  DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
  DASHSCOPE_MODEL: "${{ secrets.DASHSCOPE_MODEL || 'qwen-turbo' }}"
  DASHSCOPE_BASE_URL: "${{ secrets.DASHSCOPE_BASE_URL || 'https://dashscope.aliyuncs.com/compatible-mode/v1' }}"

jobs:
  # =============================================================================
  # Job 1: 环境搭建
  # =============================================================================
  setup:
    name: 环境搭建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: 安装全量依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[judge,dev,viz,multimodal]"

  # =============================================================================
  # Job 2: 全量评测
  # =============================================================================
  full_evaluation:
    name: 全量评测
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 恢复环境
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}

      - name: 安装依赖
        run: pip install -e ".[judge,dev,viz,multimodal]"

      # ---------- 单元测试 ----------
      - name: 单元测试
        run: python -m pytest tests/ -v --tb=short

      # ---------- 安全评测 ----------
      - name: 安全 Level 1
        run: python -m llm_guard_bench.cli safety --level 1 --output ${RESULTS_DIR}/nightly
      - name: 安全 Level 2
        run: python -m llm_guard_bench.cli safety --level 2 --output ${RESULTS_DIR}/nightly
      - name: 安全 Level 3
        run: python -m llm_guard_bench.cli safety --level 3 --output ${RESULTS_DIR}/nightly

      # ---------- 能力评测 ----------
      - name: 能力评测
        run: python -m llm_guard_bench.cli run --config configs/evaluation/capability.yaml --output ${RESULTS_DIR}/nightly

      # ---------- 性能基准 ----------
      - name: 性能基准
        run: python -m llm_guard_bench.cli perf --output ${RESULTS_DIR}/nightly

      # ---------- Agent评测 ----------
      - name: Agent评测
        run: python -m llm_guard_bench.cli agent --task full --output ${RESULTS_DIR}/nightly

      # ---------- 体验评测 ----------
      - name: 体验评测
        run: python -m llm_guard_bench.cli experience --task full --output ${RESULTS_DIR}/nightly

      # ---------- AI测试工具 ----------
      - name: AI测试工具
        run: python -m llm_guard_bench.cli aitest --task full --output ${RESULTS_DIR}/nightly

      # ---------- Judge对齐 ----------
      - name: Judge对齐
        run: python -m llm_guard_bench.cli alignment --task demo --samples 30 --output ${RESULTS_DIR}/nightly

      # ---------- 生成报告 ----------
      - name: 生成日报
        run: |
          mkdir -p ${REPORT_DIR}
          DATE=$(date +%Y%m%d)
          REPORT_FILE=${REPORT_DIR}/nightly_${DATE}.md

          cat > $REPORT_FILE << EOF
          # LLM Guard Bench 每日评测报告
          日期: $(date '+%Y-%m-%d %H:%M:%S')

          ## 评测摘要
          - 安全评测: Level 1-3 全量
          - 能力评测: 全量
          - 性能基准: 27场景矩阵
          - Agent评测: 三任务全量
          - 体验评测: UX/A/B/优化闭环
          - AI测试工具: 全量
          - Judge对齐: 30样本

          ## 状态
          ✅ 所有评测任务完成
          EOF

          echo "日报已生成: $REPORT_FILE"

      # ---------- 归档 ----------
      - name: 归档报告
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ github.run_id }}
          path: |
            ${{ env.RESULTS_DIR }}/nightly/
            ${{ env.REPORT_DIR }}/
          retention-days: 90

  # =============================================================================
  # Job 3: 质量退化检测
  # =============================================================================
  regression_check:
    name: 质量退化检测
    needs: full_evaluation
    runs-on: ubuntu-latest
    if: ${{ ! github.event.inputs.skip-compare }}
    steps:
      - uses: actions/checkout@v4

      - name: 下载前一天报告
        uses: actions/download-artifact@v4
        with:
          pattern: nightly-*
          path: previous_results/
          merge-multiple: true

      - name: 运行退化检测
        run: |
          pip install -e ".[judge,dev]"
          python scripts/compare_metrics.py \
            --current ${RESULTS_DIR}/nightly \
            --previous previous_results/ \
            --threshold 0.05 \
            --output ${REPORT_DIR}/regression_report.json

      - name: 退化检测结论
        if: failure()
        run: |
          echo "⚠️  检测到质量退化！"
          cat ${REPORT_DIR}/regression_report.json
          exit 1

      - name: 生成结论摘要
        run: |
          echo "## 质量退化检测" >> $GITHUB_STEP_SUMMARY
          echo "✅ 未检测到明显退化" >> $GITHUB_STEP_SUMMARY

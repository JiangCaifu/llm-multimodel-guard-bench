# 数据集配置 - C-Eval (中文综合能力评测)
name: c_eval
version: 1.0.0

source:
  type: huggingface
  path: C-Eval/C-Eval
  subset: null
  split: test

eval:
  method: multiple_choice
  sample_size: 500
  random_seed: 42
  n_shot: 5

prompt_template: |
  以下是关于{{ subject }}的单项选择题。

  {{ few_shot_examples }}

  题目：{{ question }}
  A. {{ choices[0] }}
  B. {{ choices[1] }}
  C. {{ choices[2] }}
  D. {{ choices[3] }}
  答案：

judge:
  method: multiple_choice
  answer_field: answer
  choices_field: choices

metadata:
  language: zh
  domain: knowledge_reasoning
  tags: [academic, chinese, multi_subject]

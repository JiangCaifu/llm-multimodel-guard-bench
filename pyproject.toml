[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-multimodel-guard-bench"
version = "0.1.0"
description = "大模型全链路评测平台 - 覆盖安全/能力/性能/多模态/Agent/AI测试工具/应用体验七大维度"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "llm-guard-bench" }]

dependencies = [
    # 模型接入层 (API 模式，无需 torch)
    "openai>=1.30.0",

    # 评测引擎
    "pyyaml>=6.0",
    "pydantic>=2.5.0",
    "jinja2>=3.1.2",

    # 数据层 (核心)
    "pandas>=2.0.0",

    # 性能压测
    "httpx>=0.25.0",
    "typing-extensions>=4.7.0",

    # 工具
    "tqdm>=4.65.0",
    "rich>=13.0.0",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# 数据集加载 (HuggingFace datasets)
datasets = [
    "datasets>=2.18.0",
    "huggingface_hub>=0.23.0",
]
# 评判层
judge = [
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "nltk>=3.8.0",
]
# 本地模型加载（需要 GPU + 大量磁盘空间）
local = [
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
]
# 调度层
scheduler = [
    "celery>=5.3.0",
    "redis>=5.0.0",
]
# 数据库
database = [
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "alembic>=1.12.0",
]
# 可视化
viz = [
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    "matplotlib>=3.7.0",
]
# 多模态
multimodal = [
    "pillow>=10.0.0",
]
# NLP
nlp = [
    "nltk>=3.8.0",
    "anthropic>=0.30.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.5.0",
    "pre-commit>=3.5.0",
]
vllm = [
    "vllm>=0.5.4",
]
label = [
    "label-studio>=1.13.0",
]
# 全量安装
all = [
    "llm-multimodel-guard-bench[local,scheduler,database,viz,multimodal,nlp,dev]"
]

[project.scripts]
guard-bench = "llm_guard_bench.cli:main"

# ========== Ruff 配置 ==========
[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = [
    "data",
    "logs",
    "results",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function call in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# ========== Pytest 配置 ==========
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=llm_guard_bench",
    "--cov-report=term-missing",
    "--cov-report=html",
]

# ========== Mypy 配置 ==========
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # 渐进式类型检查
ignore_missing_imports = true
exclude = [
    "tests/",
    "data/",
]

# ========== Setuptools 配置 ==========
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_guard_bench = ["py.typed"]

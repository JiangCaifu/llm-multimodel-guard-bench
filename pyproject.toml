[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-multimodel-guard-bench"
version = "0.1.0"
description = "大模型全链路评测平台 - 覆盖安全/能力/性能/多模态/Agent/AI测试工具/应用体验七大维度"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "llm-guard-bench" }]

dependencies = [
    # 模型接入层
    "openai>=1.40.0",
    "anthropic>=0.34.0",
    "transformers>=4.44.0",
    "torch>=2.3.0",
    "huggingface_hub>=0.24.0",
    "accelerate>=0.33.0",

    # 评测引擎
    "pyyaml>=6.0.1",
    "pydantic>=2.8.0",
    "jinja2>=3.1.4",

    # 调度层
    "celery>=5.4.0",
    "redis>=5.0.0",

    # 数据层
    "sqlalchemy>=2.0.32",
    "pymysql>=1.1.1",
    "alembic>=1.13.2",
    "pandas>=2.2.2",
    "datasets>=2.21.0",

    # 评判层
    "scikit-learn>=1.5.1",
    "scipy>=1.14.0",
    "nltk>=3.8.1",

    # 可视化
    "streamlit>=1.37.0",
    "plotly>=5.23.0",
    "matplotlib>=3.9.0",

    # 多模态
    "pillow>=10.4.0",

    # 性能压测
    "httpx>=0.27.0",
    "typing-extensions>=4.12.0",

    # 工具
    "tqdm>=4.66.0",
    "rich>=13.7.0",
    "loguru>=0.7.2",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.7",
    "mypy>=1.11.0",
    "pre-commit>=3.7.0",
]
vllm = [
    "vllm>=0.5.4",
]
label = [
    "label-studio>=1.13.0",
]

[project.scripts]
guard-bench = "llm_guard_bench.cli:main"

# ========== Ruff 配置 ==========
[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = [
    "data",
    "logs",
    "results",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function call in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# ========== Pytest 配置 ==========
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=llm_guard_bench",
    "--cov-report=term-missing",
    "--cov-report=html",
]

# ========== Mypy 配置 ==========
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # 渐进式类型检查
ignore_missing_imports = true
exclude = [
    "tests/",
    "data/",
]

# ========== Setuptools 配置 ==========
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_guard_bench = ["py.typed"]
